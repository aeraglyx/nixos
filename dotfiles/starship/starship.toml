format = """
[╭── ](bold meh)\
$jobs\
$hostname\
$directory\
$git_branch\
$git_status\
$nix_shell\
\n[╰─](bold meh)\
$character
"""

palette = "onyx"

[jobs]
style = "bold red"

[directory]
truncation_length = 3
truncation_symbol = "../"
truncate_to_repo = false
style = "text"
read_only = "  "
read_only_style = "yellow"

[git_branch]
symbol = " "
style = "text"
format = '[on](meh) [$symbol$branch]($style) '

[git_status]
disabled = true
style = "meh"

[nix_shell]
symbol = "󱄅 "
style = "text"
format = '[via](meh) [$symbol$name]($style) '

[character]
success_symbol = "[λ](bold blue)"
error_symbol = "[λ](bold red)"

[hostname]
style = "blue"
format = '[$hostname]($style) [in](meh) '

[palettes.onyx]
smol = "#383838"
dim  = "#525252"
meh  = "#8b8b8b"
text = "#c8c8c8"
red  = "#f99dc5"
blue = "#a2c3d6"
