general {
    lock_cmd = pidof hyprlock || hyprlock
    # before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

listener {
    timeout = 1792
    on-timeout = notify-send "Suspend in 8s"
}

listener {
    timeout = 1800
    on-timeout = pkill parsecd ; loginctl lock-session ; sleep 0.1 ; systemctl suspend
}
